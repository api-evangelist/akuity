observations:
  - >-
    The graph is a strict tree, not a mesh: there are no cross-organization
    references and no many-to-many join resources in the public surface.
  - >-
    Workspace scoping is expressed by route duplication rather than by a
    parameter. That is why 155 Argo CD operations cover only ~80 distinct RPCs —
    most operations carry an `_1` sibling that is the workspace-scoped binding of
    the same method.
  - >-
    The Kubernetes inventory (k8s/*) is a denormalised read model over every
    connected cluster, not part of the write graph. It has no create/update/delete
    operations at all.
