aid: akuity
name: Akuity
description: >-
  Akuity is the enterprise software delivery company founded by the creators of
  Argo CD and Kargo. The Akuity Platform is its commercial, fully-managed
  offering: hosted, enterprise-grade Argo CD control planes for GitOps continuous
  delivery, managed Kargo for multi-stage progressive promotion, the Akuity Agent
  for connecting target Kubernetes clusters, and Akuity Intelligence — an AI layer
  adding multi-cluster insight dashboards, on-call and promotion advisor agents,
  and AI-assisted remediation. The platform is controlled by a REST API at
  https://akuity.cloud/api/v1/, an `akuity` CLI, a Terraform provider and a
  Crossplane provider, all of which speak the same grpc-gateway service surface.
  Akuity runs on AWS with US and EU data residency and maintains SOC 2 Type II,
  ISO 27001:2022, PCI DSS 4.0.1, HIPAA-aligned and CSA STAR Level 1 posture.
