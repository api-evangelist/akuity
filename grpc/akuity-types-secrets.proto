syntax = "proto3";

package akuity.types.secrets.v1;

option csharp_namespace = "Akuity.Types.Secrets.V1";

option go_package = "github.com/akuityio/akuity-platform/pkg/api/gen/types/secrets/v1;secretsv1";

option java_multiple_files = true;

option java_outer_classname = "SecretsProto";

option java_package = "com.akuity.types.secrets.v1";

option objc_class_prefix = "ATS";

option php_metadata_namespace = "Akuity\\Types\\Secrets\\V1\\GPBMetadata";

option php_namespace = "Akuity\\Types\\Secrets\\V1";

option ruby_package = "Akuity::Types::Secrets::V1";

message ObjectSelector {
  map<string, string> match_labels = 1;

  repeated LabelSelectorRequirement match_expressions = 2;
}

message LabelSelectorRequirement {
  optional string key = 1;

  optional string operator = 2;

  repeated string values = 3;
}

message ClusterSecretMapping {
  ObjectSelector clusters = 1;

  ObjectSelector secrets = 2;
}

message SecretsManagementConfig {
  repeated ClusterSecretMapping sources = 1;

  repeated ClusterSecretMapping destinations = 2;
}
