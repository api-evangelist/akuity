deprecation_policy:
  published: false
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  deprecated_operations: []
  note: >-
    Akuity publishes no API deprecation policy, no Sunset/Deprecation response
    headers, and no operation in the published protobuf descriptors carries a
    `deprecated` option. What it does publish are forward-looking *compatibility
    matrices* for self-hosted deployments, which serve a related but different
    purpose.
  compatibility_matrices:
    - https://docs.akuity.io/changelog/selfhosted/argocd-compatibility
    - https://docs.akuity.io/changelog/selfhosted/kargo-compatibility
    - https://docs.akuity.io/changelog/selfhosted/agent-compatibility

